<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>MRI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-width: 100%;
      max-width: 100%;

      height: 100%;
      min-height: 100%;

      overflow: hidden;

      background: #ffffff;
    }

    body {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #appFrame {
      position: fixed;

      top: 0;
      left: 0;

      display: block;

      width: 100%;
      min-width: 100%;
      max-width: 100%;

      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      border: 0;
      outline: 0;

      overflow: hidden;

      background: #ffffff;
    }

    @supports not (height: 100dvh) {
      body,
      #appFrame {
        height: 100vh;
      }
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"

    src="https://script.google.com/macros/s/AKfycbwJiaqf59jHAH1L3vwVk3fi7ZF1Q7O4Ls06FoqiABwzsj1IyxVUth0JHuHf4ijYFBaa/exec"

    title="MRI"

    scrolling="no"

    allow="fullscreen"

    allowfullscreen
  ></iframe>

  <script>
    function resizeApp() {
      const frame = document.getElementById("appFrame");

      const width =
        window.visualViewport
          ? window.visualViewport.width
          : window.innerWidth;

      const height =
        window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

      frame.style.width = width + "px";
      frame.style.height = height + "px";
    }

    window.addEventListener("load", resizeApp);

    window.addEventListener("resize", resizeApp);

    window.addEventListener("orientationchange", function () {
      setTimeout(resizeApp, 200);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        resizeApp
      );
    }
  </script>

</body>
</html>
