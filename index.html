<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <!-- Mobile / responsive viewport -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- Mobile web-app support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>MRI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #appFrame {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      border: none;
      outline: none;

      display: block;
      background: #ffffff;
    }

    /* Fallback for older phones */
    @supports not (height: 100dvh) {
      body,
      #appFrame {
        height: 100vh;
      }
    }

    /* Safe-area support for phones with notches */
    @supports (padding: env(safe-area-inset-top)) {
      body {
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      #appFrame {
        width: calc(
          100vw -
          env(safe-area-inset-left) -
          env(safe-area-inset-right)
        );

        height: calc(
          100dvh -
          env(safe-area-inset-top) -
          env(safe-area-inset-bottom)
        );

        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
      }
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwJiaqf59jHAH1L3vwVk3fi7ZF1Q7O4Ls06FoqiABwzsj1IyxVUth0JHuHf4ijYFBaa/exec"
    title="MRI"
    allow="fullscreen"
    allowfullscreen
  ></iframe>

</body>
</html>
